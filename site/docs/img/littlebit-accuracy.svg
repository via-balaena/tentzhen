<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" aria-labelledby="title desc">
<title id="title">Test accuracy against bits per weight, E1 to E8</title>
<desc id="desc">MNIST test images right, in percent, against layer 1's total bits per weight on a log scale: E1, 32 bits, 98.31 %; E2, 8 bits, 98.33 %; E3, 1.01 bits, 98.24 %; E4, 0.062 bits, 87.91 %; E5, 0.083 bits, 94.63 %; E6, 0.125 bits, 97.17 %; E7, 0.209 bits, 97.76 %; E8, 0.376 bits, 98.15 %. E4 to E8 are LittleBit at r = 4 to 64; E1 to E3 are dense, FP32, int8 and binary. The experiments table gives each.</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .surface { fill: #fcfcfb; }
  .title { fill: #0b0b0b; font-size: 15px; font-weight: 600; }
  .subtitle, .legend, .label, .axis-title { fill: #52514e; font-size: 12px; }
  .label { font-size: 11px; }
  .tick { fill: #898781; font-size: 11px; font-variant-numeric: tabular-nums; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .reference { stroke: #898781; stroke-width: 1; }
  .line-1 { fill: none; stroke: #2a78d6; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot-1 { fill: #2a78d6; stroke: #fcfcfb; stroke-width: 2; }
  .dot-2 { fill: #eb6834; stroke: #fcfcfb; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .title { fill: #f0efec; }
    .subtitle, .legend, .label, .axis-title { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; }
    .axis { stroke: #383835; }
    .line-1 { stroke: #3987e5; }
    .dot-1 { fill: #3987e5; stroke: #1a1a19; }
    .dot-2 { fill: #d95926; stroke: #1a1a19; }
  }
</style>
<rect class="surface" width="680" height="430" rx="8"/>
<text class="title" x="24.0" y="28.0" text-anchor="start">Test accuracy against bits per weight, E1 to E8</text>
<text class="subtitle" x="24.0" y="47.0" text-anchor="start">MNIST's 10,000 test images, as the integer golden model scores them; E1 in float</text>
<line class="line-1" x1="24.0" y1="66.0" x2="44.0" y2="66.0"/>
<circle class="dot-1" cx="34.0" cy="66.0" r="5"/>
<text class="legend" x="52.0" y="70.0" text-anchor="start">LittleBit, r = 4 to 64 (E4 to E8)</text>
<circle class="dot-2" cx="290.0" cy="66.0" r="5"/>
<text class="legend" x="300.0" y="70.0" text-anchor="start">dense: binary, int8 and FP32 (E3, E2, E1)</text>
<line class="grid" x1="64.0" y1="370.0" x2="648.0" y2="370.0"/>
<text class="tick" x="56.0" y="374.0" text-anchor="end">86</text>
