<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" aria-labelledby="title desc">
<title id="title">Logic cells against sign bits, Variant A</title>
<desc id="desc">nextpnr's logic cells for the whole board design against the sign bits its two hidden layers hardwire, 1,424 a unit of rank, with Gate 2's budget of 30,000 cells: E4 at r = 4, 5,696 sign bits, 6,889 cells, 55.27 MHz; E5 at r = 8, 11,392 sign bits, 8,939 cells, 50.06 MHz; E6 at r = 16, 22,784 sign bits, 12,640 cells, 55.63 MHz; E7 at r = 32, 45,568 sign bits, 20,172 cells, 50.43 MHz; E11 at r = 42, 59,808 sign bits, 24,934 cells, 50.29 MHz; E8 at r = 64, 91,136 sign bits, 35,139 cells, 49.55 MHz. The experiments table gives each.</desc>
<style>
  svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .surface { fill: #fcfcfb; }
  .title { fill: #0b0b0b; font-size: 15px; font-weight: 600; }
  .subtitle, .legend, .label, .axis-title { fill: #52514e; font-size: 12px; }
  .label { font-size: 11px; }
  .tick { fill: #898781; font-size: 11px; font-variant-numeric: tabular-nums; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .reference { stroke: #898781; stroke-width: 1; }
  .line-1 { fill: none; stroke: #2a78d6; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot-1 { fill: #2a78d6; stroke: #fcfcfb; stroke-width: 2; }
  .dot-2 { fill: #eb6834; stroke: #fcfcfb; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .title { fill: #f0efec; }
    .subtitle, .legend, .label, .axis-title { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; }
    .axis { stroke: #383835; }
    .line-1 { stroke: #3987e5; }
    .dot-1 { fill: #3987e5; stroke: #1a1a19; }
    .dot-2 { fill: #d95926; stroke: #1a1a19; }
  }
</style>
<rect class="surface" width="680" height="430" rx="8"/>
<text class="title" x="24.0" y="28.0" text-anchor="start">Logic cells against sign bits, Variant A</text>
<text class="subtitle" x="24.0" y="47.0" text-anchor="start">The board's whole design, weights hardwired, as nextpnr counts its cells (TRELLIS_COMB)</text>
<line class="grid" x1="72.0" y1="370.0" x2="648.0" y2="370.0"/>
<text class="tick" x="64.0" y="374.0" text-anchor="end">0</text>
<line class="grid" x1="72.0" y1="305.0" x2="648.0" y2="305.0"/>
<text class="tick" x="64.0" y="309.0" text-anchor="end">10K</text>
<line class="grid" x1="72.0" y1="240.0" x2="648.0" y2="240.0"/>
<text class="tick" x="64.0" y="244.0" text-anchor="end">20K</text>
