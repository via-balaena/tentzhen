# Publishes site/ to GitHub Pages, served at tentzhen.com: main only, and only a commit whose
# Quality Gate run passed on main. By hand, from the Actions tab or `gh workflow run Pages --ref
# main`, it publishes main as it is.
name: Pages

on:
  workflow_run:
    workflows: [Quality Gate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, and a newer one waits rather than cancelling a publish under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish site/
    # A Quality Gate run on main's push, in this repo: `branches: [main]` above matches the branch's
    # name alone, which a pull request from a fork can share.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the Quality Gate passed, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
