# The status check main's ruleset requires. The ruleset matches the job's
# `name:`, so renaming the job blocks every merge until the ruleset follows.
name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    # A cold cache builds DuckDB from source twice (check and test): about 17 minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: The mural SVGs are exactly what brand/mural.py draws
        run: python3 brand/mural.py && test -z "$(git status --porcelain -- brand)"
      - name: The site's images are brand/'s files, byte for byte
        run: for f in site/img/*.svg; do cmp "$f" "brand/$(basename "$f")"; done
      - name: The build pages are exactly what crates/site generates
        run: |
          cargo run -q -p tentzhen-site --locked
          git status --porcelain -- site
          test -z "$(git status --porcelain -- site)"
      - name: A published build version never changes
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/main
        run: |
          git fetch -q --depth=1 origin main
          for f in $(git ls-tree -r --name-only "$BASE" -- builds | grep -E '^builds/[^/]+/v[0-9]+\.toml$'); do
            git show "$BASE:$f" | grep -q '^status = "published"' || continue
            if ! git diff --quiet "$BASE" -- "${f%.toml}.*"; then
              echo "::error file=$f::$f is published; change it in a new version instead"
              exit 1
            fi
          done
