# The status check main's ruleset requires. The ruleset matches the job's
# `name:`, so renaming the job blocks every merge until the ruleset follows.
name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # By hand, from the Actions tab or `gh workflow run "Quality Gate" --ref main`: GitHub started no
  # run for #18's merge, and without this there was no way to start one.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the gate's older run on it, whose commit is no longer the
# pull request's head. Every other run, on main or started by hand, is a group of its own, so none
# is cancelled or held back. One group for main would not do: by default GitHub cancels a run
# waiting in a group when another joins it, cancel-in-progress or not (github/docs at 336b7f546d,
# data/reusables/actions/actions-group-concurrency.md: the default queue is "single").
concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    # A cold cache builds DuckDB from source twice (check and test): about 17 minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: The enforcer builds for the RP2350, with no standard library
        run: cargo build -p tentzhen-enforcer --target thumbv8m.main-none-eabi --locked
      - name: Kani checks the enforcer's rules
        # Kani is pinned here; `cargo kani setup` fetches the toolchain that release uses.
        run: |
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup
          cargo kani -p tentzhen-enforcer
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: The mural SVGs are exactly what brand/mural.py draws
        run: python3 brand/mural.py && test -z "$(git status --porcelain -- brand)"
      - name: The site's images are brand/'s files, byte for byte
        run: for f in site/img/*.svg; do cmp "$f" "brand/$(basename "$f")"; done
      - name: The build pages are exactly what crates/site generates
        run: |
          cargo run -q -p tentzhen-site --locked
          git status --porcelain -- site
          test -z "$(git status --porcelain -- site)"
      - name: A published build version never changes
        # On every run but a push to main, which has nothing to compare with. A run started by hand
        # on a branch must check this too: it posts the same Quality Gate check a PR's run does.
        if: github.event_name != 'push'
        env:
          BASE: origin/main
        run: |
          git fetch -q --depth=1 origin main
          for f in $(git ls-tree -r --name-only "$BASE" -- builds | grep -E '^builds/[^/]+/v[0-9]+\.toml$'); do
            git show "$BASE:$f" | grep -q '^status = "published"' || continue
            if ! git diff --quiet "$BASE" -- "${f%.toml}.*"; then
              echo "::error file=$f::$f is published; change it in a new version instead"
              exit 1
            fi
          done
      - name: The lab log only grows
        # Each of main's log files must be the start of the same file here: entries are added at
        # the end, never changed, moved or removed (crates/records/src/log.rs). On every run but a
        # push to main, as above.
        if: github.event_name != 'push'
        env:
          BASE: origin/main
        run: |
          git fetch -q --depth=1 origin main
          for f in $(git ls-tree -r --name-only "$BASE" -- lab/log | grep -E '^lab/log/[^/]+\.jsonl$'); do
            if [ ! -f "$f" ] || ! cmp -s -n "$(git cat-file -s "$BASE:$f")" <(git show "$BASE:$f") "$f"; then
              echo "::error file=$f::$f is the lab log, which only grows: add entries at its end and change none"
              exit 1
            fi
          done
      - name: A measurement record never changes
        # Each of main's measurement records must be here, byte for byte: a record is what was
        # measured, and a new measurement is a new record (crates/records/src/measurement.rs). On
        # every run but a push to main, as above.
        if: github.event_name != 'push'
        env:
          BASE: origin/main
        run: |
          git fetch -q --depth=1 origin main
          for f in $(git ls-tree -r --name-only "$BASE" -- lab/records | grep -E '^lab/records/[^/]+\.toml$'); do
            if [ ! -f "$f" ] || ! cmp -s <(git show "$BASE:$f") "$f"; then
              echo "::error file=$f::$f is a measurement record, which never changes: measure again in a new record"
              exit 1
            fi
          done
