# The status check main's ruleset requires. The ruleset matches the job's
# `name:`, so renaming the job blocks every merge until the ruleset follows.
name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # By hand, from the Actions tab or `gh workflow run "Quality Gate" --ref main`: GitHub started no
  # run for #18's merge, and without this there was no way to start one.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the gate's older run on it, whose commit is no longer the
# pull request's head. Every other run, on main or started by hand, is a group of its own, so none
# is cancelled or held back. One group for main would not do: by default GitHub cancels a run
# waiting in a group when another joins it, cancel-in-progress or not (github/docs at 336b7f546d,
# data/reusables/actions/actions-group-concurrency.md: the default queue is "single").
concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    # A cold cache builds DuckDB from source twice (clippy and test), and the gateware's cocotb
    # tests take 12 to 15 minutes more. A run with no cache is cut off at 40: via-balaena's first
    # run of this branch was, in the cocotb step, after clippy's 10 minutes and the tests' 15
    # (run 45261560163, 2026-11-23). A run whose cache is warm takes 16 to 20.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # MNIST for crates/littlebit's tests, which re-score the committed training runs. Its terms
      # are unread, so it is fetched, never committed; the tests refuse a file that is not its pin
      # in models/littlebit/mnist.toml, so this step only downloads.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mnist
          key: mnist-${{ hashFiles('models/littlebit/mnist.toml') }}
      - name: Fetch MNIST from the mirror models/littlebit/mnist.toml names
        run: |
          mkdir -p "$RUNNER_TEMP/mnist"
          mirror=$(sed -n 's/^mirror = "\(.*\)"$/\1/p' models/littlebit/mnist.toml)
          for f in $(sed -n 's/^"\([a-z0-9-]*\.gz\)" = .*/\1/p' models/littlebit/mnist.toml); do
            [ -f "$RUNNER_TEMP/mnist/$f" ] || curl -sSfL -o "$RUNNER_TEMP/mnist/$f" "$mirror$f"
          done
          ls -l "$RUNNER_TEMP/mnist"
      - run: cargo test --workspace --locked
        env:
          MNIST_DIR: ${{ runner.temp }}/mnist
      # The gateware's cocotb tests, on Verilator, with OSS CAD Suite's Linux build of the same day
      # as the lab computer's. The archive is cached, and checked against its sha256 every run.
      # The full-network test has the golden model score MNIST's 10,000 test images, by `cargo
      # run`, into its own temporary folder, so it needs MNIST too.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/oss-cad-suite-linux-x64-20261121.tgz
          key: oss-cad-suite-linux-x64-20261121
      - name: The gateware's cocotb tests, on Verilator from OSS CAD Suite 2026-11-21
        env:
          MNIST_DIR: ${{ runner.temp }}/mnist
        run: |
          f="$RUNNER_TEMP/oss-cad-suite-linux-x64-20261121.tgz"
          [ -f "$f" ] || curl -sSfL -o "$f" "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-11-21/oss-cad-suite-linux-x64-20261121.tgz"
          echo "da62ff9cd16a69fc23607f3430459a3ca405561063e93910bf71d99012bb59e2  $f" | sha256sum -c -
          tar xzf "$f" -C "$RUNNER_TEMP"
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          python3 -m pytest -q -rA gateware
      - name: The enforcer builds for the RP2350, with no standard library
        run: cargo build -p tentzhen-enforcer --target thumbv8m.main-none-eabi --locked
      - name: Kani checks the enforcer's rules
        # Kani is pinned here; `cargo kani setup` fetches the toolchain that release uses.
        run: |
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup
          cargo kani -p tentzhen-enforcer
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: The mural SVGs are exactly what brand/mural.py draws
        run: python3 brand/mural.py && test -z "$(git status --porcelain -- brand)"
      - name: The site's images are brand/'s files, byte for byte
        run: for f in site/img/*.svg; do cmp "$f" "brand/$(basename "$f")"; done
      - name: The build pages are exactly what crates/site generates
        run: |
          cargo run -q -p tentzhen-site --locked
          git status --porcelain -- site
          test -z "$(git status --porcelain -- site)"
      - name: A published build version never changes
        # On every run but a push to main, which has nothing to compare with. A run started by hand
        # on a branch must check this too: it posts the same Quality Gate check a PR's run does.
        if: github.event_name != 'push'
        env:
          BASE: origin/main
        run: |
          git fetch -q --depth=1 origin main
          for f in $(git ls-tree -r --name-only "$BASE" -- builds | grep -E '^builds/[^/]+/v[0-9]+\.toml$'); do
            git show "$BASE:$f" | grep -q '^status = "published"' || continue
            if ! git diff --quiet "$BASE" -- "${f%.toml}.*"; then
              echo "::error file=$f::$f is published; change it in a new version instead"
              exit 1
            fi
          done
      - name: The lab log only grows
        # Each of main's log files must be the start of the same file here: entries are added at
        # the end, never changed, moved or removed (crates/records/src/log.rs). On every run but a
        # push to main, as above.
        if: github.event_name != 'push'
        env:
          BASE: origin/main
        run: |
          git fetch -q --depth=1 origin main
          for f in $(git ls-tree -r --name-only "$BASE" -- lab/log | grep -E '^lab/log/[^/]+\.jsonl$'); do
            if [ ! -f "$f" ] || ! cmp -s -n "$(git cat-file -s "$BASE:$f")" <(git show "$BASE:$f") "$f"; then
              echo "::error file=$f::$f is the lab log, which only grows: add entries at its end and change none"
              exit 1
            fi
          done
      - name: A measurement record never changes
        # Each of main's measurement records must be here, byte for byte: a record is what was
        # measured, and a new measurement is a new record (crates/records/src/measurement.rs). On
        # every run but a push to main, as above.
        if: github.event_name != 'push'
        env:
          BASE: origin/main
        run: |
          git fetch -q --depth=1 origin main
          for f in $(git ls-tree -r --name-only "$BASE" -- lab/records | grep -E '^lab/records/[^/]+\.toml$'); do
            if [ ! -f "$f" ] || ! cmp -s <(git show "$BASE:$f") "$f"; then
              echo "::error file=$f::$f is a measurement record, which never changes: measure again in a new record"
              exit 1
            fi
          done
