build = "digitizer"
version = 1
# draft: may still change. published: frozen; any change is a new version.
status = "draft"
does = "The two-channel digitizer and signal generator on module front ends (tier 2): two inputs and two outputs on an ECP5 FPGA board. Two AD9226 modules sample the inputs, a dual AD9767 module drives the outputs, and the host reaches it through the board's USB debugger."

# Where each module goes, until a LiteX platform file holds the pins (roadmap.md, Phase 1). A
# [[pin]] names one board's pins, and this wiring spans four headers, so there is no pin table yet.
#
# The extension board has six 2x15 headers, P1 to P6, with pin k facing pin 31 - k
# (schematic/i5-i9-extboard.pdf in wuxx/Colorlight-FPGA-Projects at ea6b2e3, read 2026-10-01). P1
# carries the two Ethernet ports' pairs, power and ground, and no FPGA I/O. On P2 to P6, pin 23 is
# 5 V, after the board's PWR switch; pins 1, 10, 21 and 30 are 3.3 V, from the extension board's
# own regulator, which takes its input ahead of that switch, so they are live whenever USB is
# plugged in; pins 2, 8, 11, 20 and 29 are ground; and the other 20 are FPGA I/O, except that P4's
# 15 and 16 are not connected.
#
#   ADC A: 14 signals (BIT1-BIT12, CLK, OTR) on P2; 5 V from P2 pin 23
#   ADC B: 14 signals on P3; 5 V from P3 pin 23
#   DAC:   32 signals (two 14-bit ports, CLK1, WRT1, CLK2, WRT2) on all 18 of P4's I/O and 14 of
#          P5's; 5 V from P4 pin 23
#
# Left alone: on P2, pins 3 (ball K18, LiteX's cpu_reset_n) and 28 (L2, the i9's LED); on P5, pins
# 13 to 18, wired to the extension board's STM32 debugger: 15 and 16 (H18, J17) its UART, which is
# LiteX's console, and 13, 14, 17 and 18 (F18, G18, H17, H16) its SPI; and all of P6, nine of whose
# pins are the FPGA's configuration pins.
# That leaves 18 I/O on P2, 20 on P3, 18 on P4 and 14 on P5, for 60 signals. The counts come from
# the extension board's schematic and the i9's ball table (colorlight_i9_v7.x.md, same repository,
# at 5042201f); the i9's own schematic is not public, so a pin the i9 uses that neither shows is
# unknown. Nothing checks the counts until nextpnr places the pins.
#
# The extension board has no Ethernet jacks: P1 carries the i9's two PHYs' pairs, so Ethernet needs
# an adapter on P1, which no build here describes yet: ours is designed in Phase 3 (roadmap.md),
# since the one that exists, i5ether in kazkojima/colorlight-i5-tips, has no license file.

[[line]]
part = "LFE5U-45F"
form = "Colorlight i9 v7.2 module, on the i5/i9 extension board"
class = "A"
qty = 1

[[line]]
part = "AD9226"
form = "module with a 2x10 male header (5 V on pins 1 and 2), 3.3 V outputs and an SMA input"
class = "A"
qty = 2

[[line]]
part = "AD9767"
form = "dual module with a 40-pin female header in the AN9767's order (5 V on pin 2), 3.3 V inputs and two BNC outputs"
class = "A"
qty = 1

[[line]]
commodity = "pin header, 2x15, 2.54 mm, male, straight"
class = "J"
qty = 4

# 19 for each ADC module: its 14 signals, one 5 V and its 4 grounds (header pins 3, 4, 19, 20).
[[line]]
commodity = "jumper wire, female to female, 10 cm, for the ADC modules' male headers"
class = "W"
qty = 38

# The DAC module's 32 signals, one 5 V and its 3 grounds (header pins 1, 37, 38).
[[line]]
commodity = "jumper wire, male to female, 10 cm, for the DAC module's female header"
class = "W"
qty = 36

[[line]]
commodity = "cable, USB-A to USB-C, with data lines"
class = "W"
qty = 1

[[line]]
commodity = "cable, BNC male to SMA male, 50 Ohm, from each output to an input"
class = "W"
qty = 2

# The walkthrough, for a person or an agent. `expect` is what you should see; until someone has
# done the step, it is a prediction from the modules' schematics: the AD9226 module's "AD9226.SchDoc"
# V1.2 (2020-02-21, as docs/AD9226-V1.2-board.pdf in kushpet/ebaz4205-sdr at 18ec936a) and Alinx's
# AN9767 schematic (2020-04-26, mirrored in chili-chips-ba/uberClock at 75c4e483), read 2026-10-01.
# A module that arrives may not match them: that is what these steps find out.

[[step]]
do = "Solder a 2x15 male header to each of P2, P3, P4 and P5 on the extension board, and seat the i9 in its socket."

[[step]]
do = "With no module connected, plug the extension board into a USB-A port with the USB-A to USB-C cable, press PWR, and measure P2 pin 23 and P2 pin 1 against P2 pin 2."
expect = "About 5 V on pin 23 and 3.3 V on pin 1. A USB-C to USB-C cable may give nothing: the board's USB-C port has no CC resistors (the schematic marks CC1 and CC2 not connected), and a USB-C source drives no VBUS until it detects a sink's pull-down on CC1 or CC2 (USB Type-C spec 1.3, sections 4.5.2.2.7 and 4.5.2.2.8.2, as quoted in Zephyr's subsys/usb/usb_c/usbc_tc_src_states.c)."
agent = "Powering a board is a hardware action: logged."

[[step]]
do = "With the board still powered, read the FPGA's JTAG IDCODE through the extension board's DAPLink debugger, with OpenOCD built for CMSIS-DAP, as Muse Lab's get-start.md (wuxx/Colorlight-FPGA-Projects at 5042201f) programs it. Write nothing to the FPGA or its flash."
expect = "0x41112043, the LFE5U-45F's IDCODE in prjtrellis-db's devices.json (YosysHQ/prjtrellis-db at 015e0330, read 2026-10-06). The LFE5UM-45F reads 0x01112043 and the LFE5UM5G-45F 0x81112043 there."
agent = "Reading it is a hardware action: logged. If it reads anything else, stop: the module is not the LFE5U-45F this build is written for. Record the reading in the i9's incoming-QA record."

[[step]]
do = "For each AD9226 module, before wiring any data line: note its package (28-lead SSOP or 48-lead LQFP), power it from P2 pin 23 to its pin 1 and P2 pin 2 to its pin 3, and measure DRVDD (SSOP pin 28, LQFP pin 29) against ground."
expect = "3.3 V: the V1.2 schematic runs DRVDD from a 3.3 V regulator. Whether LQFP boards do the same is unknown."
agent = "If DRVDD reads 5 V, stop: the module's outputs would put 5 V on FPGA pins, and the ECP5 allows at most 3.63 V on an I/O pin, even briefly (Lattice FPGA-DS-02012 1.9, Table 3.1)."

[[step]]
do = "With the module still powered, measure the AD8138's pin 2 (VOCM) against ground (docs/scope.md, \"Known part issues\")."
expect = "2.0 V on a module wired as the V1.2 schematic is, with VOCM on the AD9226's reference: the variant that clips early."
agent = "Record the reading, the package and the seller in the module's incoming-QA record."

[[step]]
do = "Power the DAC module from P4 pin 23 to its pin 2 and P4 pin 2 to its pin 1, with no data line, and measure its DVDD against ground."
expect = "3.3 V: the AN9767 schematic runs DVDD from a 3.3 V regulator."
agent = "If DVDD reads 5 V, stop: the DAC would need 3.5 V for a logic 1, more than 3.3 V logic drives."

[[step]]
do = "With the USB cable unplugged, wire ADC A's 14 signals to P2's I/O, ADC B's to P3's, and the DAC's 32 to all 18 of P4's I/O and 14 of P5's; each module's 5 V to pin 23 of P2, P3 and P4, and its grounds to that header's grounds. Leave P2's pins 3 (K18) and 28 (L2) and P5's pins 13 to 18 unwired: the i9 and the extension board's debugger use them. Which signal takes which pin waits for the LiteX platform file (roadmap.md, Phase 1)."

[[step]]
do = "With the capture gateware (roadmap.md, Phase 2), feed each input a slow ramp from the DAC through a BNC to SMA cable, and read the codes."
expect = "Codes that rise with the ramp: the V1.2 schematic ties the SSOP's MODE pin to AVDD, which selects straight binary (AD9226 data sheet, Table I). A single jump at mid-scale is what two's complement output looks like (Table IV). If the codes jump about, the module labels its bits in the other order: sellers number D0 to D11 both ways."

# What this build claims. Where a claim has no referent it is unknown: the build is a draft nobody
# has built.

[[claim]]
# AD9226#sample-rate is the chip's rating. Through 10 cm jumper wires it is unknown until measured.
# Scoped's README (wavius/Scoped at 24991642, read 2026-10-01) clocks an AD9226 module at 25 MHz
# over 20 cm jumper wires, and shows its demo over UART at a 50 kHz acquisition rate, as USB kept
# dropping.
id = "samples-at"
says = "Samples each input at up to `max_sample_hertz`"
values = { max_sample_hertz = 65000000.0 }

[[claim]]
# AD9767#update-rate is the chip's rating; through jumper wires it is unknown until measured.
id = "updates-at"
says = "Updates each output at up to `max_update_hertz`"
values = { max_update_hertz = 125000000.0 }

[[claim]]
# The AD9226 module's V1.2 schematic: DRVDD on +3.3 V from an AX1117-3.3. The AN9767 schematic:
# DVDD1 and DVDD2 on D3V3 from a 1117-3.3. The walkthrough measures each module on arrival.
id = "logic-at-3v3"
says = "Every module's logic runs at 3.3 V: the AD9226 modules' output drivers and the AD9767 module's digital inputs are supplied by 3.3 V regulators on the modules"
trusted = "aliexpress-modules"

[[claim]]
# The AD9226 module's V1.2 schematic: +5 V on header pins 1 and 2, and an AX1117-3.3 makes its
# 3.3 V. The AN9767 schematic: +5 V on J3 pin 2, two MC34063A converters make its +-5.7 V, and a
# 1117-3.3 its 3.3 V. The extension board's schematic: 5 V on pin 23 of P2 to P6.
id = "runs-from-5v"
says = "Each module runs from 5 V alone, which pin 23 of each of P2 to P6 carries"
trusted = "aliexpress-modules"

[[claim]]
# The extension board's 5 V comes from its USB-C port through a fuse, F1, whose rating the
# schematic does not print, and nobody has measured what the i9 and the three modules draw.
id = "one-usb-port"
says = "One USB port powers the i9 and all three modules"

[[claim]]
# Needs an adapter on P1 (see the top of this file), which no build here describes yet.
id = "ethernet"
says = "Reaches the host over Ethernet"
