  <!-- legend and title block -->
  <g font-size="11" letter-spacing="1" fill="#a3a7ad">
    <path d="M120 560 H160" stroke="#e0aa45" stroke-width="4" stroke-linecap="round"/>
    <text x="172" y="564">REQUIRED</text>
    <path d="M270 560 H310" stroke="#7a5c26" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8"/>
