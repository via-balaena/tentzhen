  <rect x="760" y="590" width="400" height="34" fill="none" stroke="#26292d" stroke-width="1"/>
  <text x="776" y="611" font-size="11" letter-spacing="1" fill="#a3a7ad">DEBUG-PROBE · V1 · DEBUGPROBE V2.3.1 ON RP2350</text>
