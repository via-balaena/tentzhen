<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="IBM Plex Mono, monospace">
  <rect width="1200" height="640" fill="#111111"/>

  <!-- lab computer, over USB -->
  <text x="864" y="58" text-anchor="middle" font-size="13" letter-spacing="1.5" fill="#f6efe0">LAB COMPUTER · USB</text>
  <path d="M864 78 V138" stroke="#6b7078" stroke-width="4" stroke-linecap="round"/>
  <circle cx="864" cy="78" r="7" fill="#6b7078"/><circle cx="864" cy="78" r="3" fill="#111111"/>

  <!-- target -->
  <rect x="120" y="190" width="300" height="300" rx="10" fill="#141517" stroke="#6b7078" stroke-width="2"/>
  <text x="150" y="228" font-size="14" letter-spacing="1.5" fill="#f6efe0">TARGET</text>
  <text x="150" y="250" font-size="12" fill="#a3a7ad">3.3 V logic</text>
  <g font-size="12" fill="#a3a7ad" text-anchor="end">
