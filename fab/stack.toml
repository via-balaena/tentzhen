# Hacker Fab's stack beside the industry's, row by row, with Tentzhen's route across each gap.
# What each field means, and what is checked, is in crates/records/src/fab.rs. tentzhen.com's fab
# page (site/fab/) is generated from this file.
#
# Every quote was read in its source on the day given, in the raw page or file. A quote from a
# table joins its cells with " | ". Hacker Fab's GitBook is read at bd1eef57, its head on
# 2026-11-25. Rows are left out where the industry's figure was not read in its own source
# that day: film-thickness metrology, electrical test, and TSMC's own N2 page. Furnaces and etch
# were not searched yet. A gap written in words carries no factor: a factor is worked out.

