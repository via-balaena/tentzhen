# MNIST: where it is fetched from, and the sha256 each of its four files must have. Read by
# models/littlebit/mnist.py and crates/littlebit, which refuse a file that is not its pin. MNIST's
# terms of use are unread (docs/littlebit.md, "Open questions"), so the files are never committed.
mirror = "https://ossci-datasets.s3.amazonaws.com/mnist/"
pinned = "the files as fetched on 2026-11-22, whose md5s were the ones torchvision lists for them (pytorch/vision at 4e0198c3, torchvision/datasets/mnist.py)"

