# What the hardware below any agent will allow.
#
# The Pico enforcer is to compile these values in, so nothing at run time can raise them. It is
# not built yet, so none of these limits is enforced by anything: `unknown`. Raising a limit is a
# change to this file, which a person is to approve (CLAUDE.md, "Safety and permission rules").
# That is a convention, not enforced: the branch rules require no approval, and agents work
# through the same GitHub account as the person, so a required review could not tell them apart.
# Nothing drives a supply or a load until the values it needs are set; the load has none yet.
#
# Every value has a basis beside it, as data. It is one of:
#   policy = "..."   a person's decision, and where it is recorded
#   same_as = "..."  a copy of another value, which it must equal
#   rule = "..."     held to a rule in crates/lab, which names the values it uses
# and may add `rests_on`: the claims the value relies on to do its job, each cited as <part>#<id>
# (parts/) or <build>/v<n>#<id>; and `at_most`: a number, of a claim it rests on, that the value
# may not exceed, as <claim>.<value name>. A claim's grade comes from its referents
# (builds/README.md, "Claims"). The warehouse gives each value the weakest bench grade among the
# claims it rests on, through every value it comes from (gold.limit_grades). A rule reads numbers
# only from the claims its value rests on, so its grade covers them.
#
# crates/lab reads this file and refuses, among other things, a key it does not know, a value that
# is not a finite number above zero, a value without exactly one basis, a copy that differs from
# its original, a DPS5005 setpoint or current limit above the supply's ceiling, and a fuse that is
# not the next rating above max_amps. Given the claims (crates/records), it also refuses a claim
# cited that does not exist, a value above its at_most, and an upstream voltage outside the
# DPS5005's input rule.

[pico_3v3]
# Any Pico or 3.3 V circuit. The voltage ceiling rests on the RP2350's rating alone: no claim covers
# another part on the supply yet. 3.4 V is 230 mV under that rating's maximum, 3.63 V, which is
# also the RP2350's absolute maximum, past which it can be damaged. The enforcer's measuring error
# and any overshoot must stay inside that margin; both are unknown until the enforcer exists, and
# at 3.6 V the margin was 30 mV. 3.4 V leaves 100 mV above a 3.3 V setting for the supply's ripple
# and the same error, also unknown. Raise it only on a measured claim (Jon, 2026-09-29). The
# current ceiling rests on nothing.
max_volts = 3.4
max_amps = 0.200
basis.max_volts.policy = "CLAUDE.md, \"Default ceilings: 3.4 V and 200 mA\""
basis.max_volts.rests_on = ["RP2350#io-supply"]
basis.max_volts.at_most = "RP2350#io-supply.max_io_supply_volts"
basis.max_amps = { policy = "CLAUDE.md, \"Default ceilings: 3.4 V and 200 mA\"" }

[supply]
# The programmable supply: bench supply -> DPS5005 running OpenDPS -> Pico enforcer -> output.
# It serves Pico circuits until a build needs more, so it takes their ceiling.
max_volts = 3.4
max_amps = 0.200
# After a trip, who may turn the output back on: "person" (a physical button on the enforcer) or
# "agent" (after the trip is logged). The lab log (lab/log/) can record a trip, but the host writes
# it, so an agent could log one itself. Whether that is enough is for the enforcer to settle, and
# until it does the agent cannot re-enable the output.
reenable = "agent"
basis.max_volts = { same_as = "pico_3v3.max_volts" }
basis.max_amps = { same_as = "pico_3v3.max_amps" }
basis.reenable = { policy = "Jon, 2026-09-28" }

[supply.upstream]
# The bench supply feeding the DPS5005's input: the least input the DPS5005 needs for its highest
# setpoint, plus the bench supply's setting error. For a 3.4 V output that is
# max(6.0, 1.1 x 3.4 = 3.74) + 0.5 = 6.5 V, from the claims it rests on.
volts = 6.5
basis.volts = { rule = "dps-input", rests_on = ["DPS5005#input-range", "bench-supply#setting-error"] }
# This layer does NOT hold the 3.4 V ceiling. Its input must be at least 6.0 V, already above
# the ceiling, and how high its output can go if the layers above it fail is `unknown`: the
# 1.1 x rule says what input the DPS5005 needs, not how far it can drive its output. Only the
# enforcer, and anything added below it, is to hold 3.4 V.
#
# Current limit: not set. It depends on the DPS5005's own draw, at no load and at max_amps out,
# which is unknown until measured on arrival.

[supply.dps]
# OpenDPS in constant-voltage mode: the voltage setpoint, and the current limit it regulates to.
# OpenDPS lists no separate over-voltage protection (README, "Control"); the stock firmware's
# S-OVP and S-OCP menus (Joy-IT manual) are gone once OpenDPS is flashed.
max_setpoint_volts = 3.4
current_limit_amps = 0.200
basis.max_setpoint_volts = { same_as = "supply.max_volts" }
basis.current_limit_amps = { same_as = "supply.max_amps", rests_on = ["DPS5005#current-limit"] }

[supply.fuse]
# In the DPS5005's output line. Fast-acting, the next 5 x 20 mm rating above max_amps, from the
# ratings crates/lab lists (one maker's IEC 60127-2 quick-acting series).
# A fuse stops current, not voltage: it is no guard against the over-voltage case above.
size = "5x20 mm"
rating_amps = 0.250
speed = "fast"
basis.size = { policy = "PR #11" }
basis.rating_amps = { rule = "next-fuse-rating" }
basis.speed = { policy = "PR #11" }
