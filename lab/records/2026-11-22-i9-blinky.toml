measures = "Whether the i9's LED blinks under Gate 0's blinky, and what it does once power-off has cleared the blinky from the FPGA"
setup = "The Colorlight i9 seated in its i5/i9 extension board, powered and loaded over the board's USB, with nothing on the headers. openFPGALoader loaded the blinky (gateware/bringup/blinky.py) into the FPGA's SRAM (lab log seq 2). Jon watched the LEDs by eye, then unplugged the USB and plugged it back in (seq 3). What the green LED did before the load is unknown."
